[package]
name = "rds2rust"
version = "0.1.40"
edition = "2021"
license = "MIT"
description = "A pure Rust library for reading and writing R's RDS (R Data Serialization) files without requiring an R runtime."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1.5"
thiserror = "2.0"
flate2 = "1.0"
smallvec = "1.13"
indexmap = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
tempfile = "3.10"
xz2 = "0.1.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "Navigator", "Window", "console", "ReadableStream"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
debug-logging = []
